version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 5
      ignore-tests: true
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    lll:
      tab-width: 1
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      # Test fixtures repeat literal values by design.
      - linters:
          - goconst
        path: internal/types/test/
      # internal/types/generated/ is vendored from Akuity's out-of-tree
      # generator. Its groupversion_info.go files carry no generated-code
      # header and still use controller-runtime's deprecated scheme.Builder.
      - linters:
          - staticcheck
        path: internal/types/generated/
        text: 'SA1019: sigs.k8s.io/controller-runtime/pkg/scheme.Builder'
      # ClusterObservation keeps its deprecated flat fields populated for
      # backward compatibility until the next API version bump; the
      # observation code and its test fill them on purpose.
      - linters:
          - staticcheck
        path: internal/types/observation/cluster(_test)?\.go
        text: 'SA1019: .*ClusterObservation\)\.\w+ is deprecated'
      # The Akuity API still serves these deprecated top-level Cluster
      # fields, and the fixture mirrors a real response.
      - linters:
          - staticcheck
        path: internal/types/test/fixtures/cluster\.go
        text: 'SA1019: .*argocd/v1\.Cluster\)\.\w+ is deprecated'
      - linters:
          - dupl
          - errcheck
          - exportloopref
          - gocyclo
          - gosec
          - unparam
        path: _test(ing)?\.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      - linters:
          - staticcheck
        text: 'SA3000:'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G104:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/crossplane/provider-template
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
