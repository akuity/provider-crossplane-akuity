---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Instance
metadata:
  name: my-kargo-agent-managed-argocd
spec:
  forProvider:
    name: my-kargo-agent-managed-argocd
    # Same workspace as the Kargo instance and agent below.
    workspace: "${data.akuity_workspace}"
    argocd:
      spec:
        version: "v3.3.8-ak.87"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoInstance
metadata:
  name: my-kargo-agent-managed-instance
spec:
  forProvider:
    name: my-kargo-agent-managed-instance
    # Same workspace as the agent below.
    workspace: "${data.akuity_workspace}"
    kargo:
      description: "My Kargo instance."
      version: "v1.10.1-ak.0"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoAgent
metadata:
  name: my-kargo-agent-managed
spec:
  forProvider:
    kargoInstanceRef:
      name: "my-kargo-agent-managed-instance"
    # Fills kargoAgentSpec.data.remoteArgocd with the Akuity ID of this
    # Instance. Set kargoAgentSpec.data.remoteArgocd directly instead to use an
    # Argo CD instance that is not managed by Crossplane.
    remoteArgocdRef:
      name: "my-kargo-agent-managed-argocd"
    name: "my-kargo-agent-managed"
    namespace: "kargo"
    # Workspace name or ID. uptest fills it from the akuity_workspace
    # datasource key; replace it when applying this example directly.
    workspace: "${data.akuity_workspace}"
    labels:
      app: "kargo"
    annotations:
      owner: "crossplane"
    kargoAgentSpec:
      description: "Akuity-managed Kargo agent connected to an Akuity Argo CD instance."
      data:
        akuityManaged: true
  providerConfigRef:
    name: akuity
