---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoInstance
metadata:
  name: my-kargo-agent-self-hosted-instance
spec:
  forProvider:
    name: my-kargo-agent-self-hosted-instance
    # Same workspace as the agent below.
    workspace: "${data.akuity_workspace}"
    kargo:
      description: "My Kargo instance."
      version: "v1.10.1-ak.0"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoAgent
metadata:
  name: my-kargo-agent-self-hosted
  annotations:
    upjet.upbound.io/manual-intervention: "Requires a reachable self-managed Argo CD at selfManagedArgocdUrl; the agent does not become healthy without it."
spec:
  forProvider:
    kargoInstanceRef:
      name: "my-kargo-agent-self-hosted-instance"
    name: "my-kargo-agent-self-hosted"
    namespace: "kargo"
    # Workspace name or ID. uptest fills it from the akuity_workspace
    # datasource key; replace it when applying this example directly.
    workspace: "${data.akuity_workspace}"
    kargoAgentSpec:
      description: "Self-hosted Kargo agent connected to a self-managed Argo CD instance."
      data:
        akuityManaged: false
        size: "medium"
        # Kargo agent version. Do not use a leading "v" here.
        targetVersion: "0.5.88"
        autoUpgradeDisabled: true
        argocdNamespace: "argocd"
        selfManagedArgocdUrl: "https://argocd.example.com"
        kustomization: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          images:
            - name: ghcr.io/akuity/kargo
              newName: quay.io/akuity/kargo
            - name: quay.io/akuity/agent
              newName: quay.io/akuity/agent
    # Installs the agent into the cluster that the kubeconfig in this Secret
    # (key "kubeconfig") points at. make e2e creates it for a second Kind cluster.
    kubeconfigSecretRef:
      name: workload-kubeconfig
      namespace: crossplane-system
    removeAgentResourcesOnDestroy: true
  providerConfigRef:
    name: akuity
