---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoInstance
metadata:
  name: my-kargo-agent-detailed-instance
spec:
  forProvider:
    name: my-kargo-agent-detailed-instance
    # Same workspace as the agent below.
    workspace: "${data.akuity_workspace}"
    kargo:
      description: "My Kargo instance."
      version: "v1.10.1-ak.0"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoAgent
metadata:
  name: my-kargo-agent-detailed
spec:
  forProvider:
    # The Kargo instance ID can be hardcoded or resolved via a
    # KargoInstance MR in the same Crossplane cluster.
    # kargoInstanceId: "my-kargo-instance-id"
    kargoInstanceRef:
      name: "my-kargo-agent-detailed-instance"
    name: "my-kargo-agent-detailed"
    namespace: "kargo"
    # Workspace name or ID. uptest fills it from the akuity_workspace
    # datasource key; replace it when applying this example directly.
    workspace: "${data.akuity_workspace}"
    labels:
      team: "platform"
    annotations:
      note: "managed by crossplane"
    kargoAgentSpec:
      description: "The my-kargo-agent-detailed agent runs Kargo controllers on the shared cluster."
      data:
        size: "auto"
        autoUpgradeDisabled: false
        # Kargo agent version. Do not use a leading "v" here.
        targetVersion: "0.5.88"
        kustomization: |
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          patches:
            - patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: kargo-controller
                spec:
                  template:
                    spec:
                      containers:
                        - name: kargo-controller
                          resources:
                            limits:
                              memory: 1Gi
                            requests:
                              cpu: 250m
                              memory: 512Mi
              target:
                kind: Deployment
                name: kargo-controller
        akuityManaged: false
        argocdNamespace: "argocd"
        selfManagedArgocdUrl: "https://argocd.example.com"
        allowedJobSa:
          - "kargo:default"
        maintenanceMode: false
        podInheritMetadata: true
        autoscalerConfig:
          kargoController:
            resourceMinimum:
              mem: "512Mi"
              cpu: "250m"
            resourceMaximum:
              mem: "2Gi"
              cpu: "1"
    # Installs the agent into the cluster that the kubeconfig in this Secret
    # (key "kubeconfig") points at. make e2e creates it for a second Kind cluster.
    kubeconfigSecretRef:
      name: workload-kubeconfig
      namespace: crossplane-system
    removeAgentResourcesOnDestroy: true
  providerConfigRef:
    name: akuity
