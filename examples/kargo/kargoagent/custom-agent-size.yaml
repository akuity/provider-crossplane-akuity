---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoInstance
metadata:
  name: my-kargo-agent-custom-instance
spec:
  forProvider:
    name: my-kargo-agent-custom-instance
    kargo:
      description: "My Kargo instance."
      version: "v1.10.1-ak.0"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: KargoAgent
metadata:
  name: my-kargo-agent-custom
  annotations:
    upjet.upbound.io/manual-intervention: "Requires a reachable self-managed Argo CD at selfManagedArgocdUrl; the agent does not become healthy without it."
spec:
  forProvider:
    kargoInstanceRef:
      name: "my-kargo-agent-custom-instance"
    name: "my-kargo-agent-custom"
    namespace: "kargo"
    kargoAgentSpec:
      description: "Self-hosted Kargo agent with explicitly configured controller resources."
      data:
        akuityManaged: false
        size: "custom"
        # custom is a provider-side convenience. The provider sends
        # platform size "large" plus generated kustomization patches.
        targetVersion: "0.5.88"
        autoUpgradeDisabled: false
        argocdNamespace: "argocd"
        selfManagedArgocdUrl: "https://argocd.example.com"
        customAgentSizeConfig:
          kargoController:
            cpu: "1000m"
            mem: "2Gi"
    # Installs the agent into the cluster that the kubeconfig in this Secret
    # (key "kubeconfig") points at. make e2e creates it for a second Kind cluster.
    kubeconfigSecretRef:
      name: workload-kubeconfig
      namespace: crossplane-system
    removeAgentResourcesOnDestroy: true
  providerConfigRef:
    name: akuity
