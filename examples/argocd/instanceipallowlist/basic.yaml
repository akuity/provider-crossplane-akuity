---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Instance
metadata:
  name: my-allowlist-instance
spec:
  forProvider:
    name: my-allowlist-instance
    argocd:
      spec:
        version: "v3.3.8-ak.87"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: InstanceIpAllowList
metadata:
  name: my-instance-allowlist
spec:
  forProvider:
    # The instance ID can be hardcoded or resolved via an Instance MR
    # in the same Crossplane cluster.
    # instanceId: "my-instance-id"
    instanceRef:
      name: "my-allowlist-instance"
    allowList:
      - ip: "10.0.0.0/24"
        description: "office vpn"
      - ip: "1.2.3.4"
        description: "bastion"
  providerConfigRef:
    name: akuity
