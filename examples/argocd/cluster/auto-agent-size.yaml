---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Instance
metadata:
  name: my-cluster-auto-instance
spec:
  forProvider:
    name: my-cluster-auto-instance
    argocd:
      spec:
        version: "v3.3.8-ak.87"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Cluster
metadata:
  name: my-cluster-auto
spec:
  forProvider:
    instanceRef:
      name: "my-cluster-auto-instance"
    name: "my-cluster-auto"
    namespace: "akuity"
    clusterSpec:
      description: "Cluster with automatically sized Argo CD agent components."
      data:
        size: "auto"
        # Auto sizing requires agent auto-upgrade to stay enabled.
        autoUpgradeDisabled: false
        autoscalerConfig:
          applicationController:
            resourceMinimum:
              cpu: "250m"
              mem: "1Gi"
            resourceMaximum:
              cpu: "3"
              mem: "2Gi"
          repoServer:
            replicaMinimum: 1
            replicaMaximum: 3
            resourceMinimum:
              cpu: "250m"
              mem: "256Mi"
            resourceMaximum:
              cpu: "3"
              mem: "2Gi"
    # Installs the agent into the cluster that the kubeconfig in this Secret
    # (key "kubeconfig") points at. make e2e creates it for a second Kind cluster.
    kubeconfigSecretRef:
      name: workload-kubeconfig
      namespace: crossplane-system
    removeAgentResourcesOnDestroy: true
  providerConfigRef:
    name: akuity
