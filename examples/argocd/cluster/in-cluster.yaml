---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Instance
metadata:
  name: management-cluster-instance
spec:
  forProvider:
    name: management-cluster-instance
    argocd:
      spec:
        version: "v3.3.8-ak.87"
  providerConfigRef:
    name: akuity
---
# Requires examples/provider/in-cluster-rbac.yaml applied first.
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Cluster
metadata:
  name: management-cluster
spec:
  forProvider:
    instanceRef:
      name: "management-cluster-instance"
    name: "management-cluster"
    namespace: "akuity"
    enableInClusterKubeconfig: true
    removeAgentResourcesOnDestroy: true
    clusterSpec:
      description: "Installs the Akuity agent into the same cluster that runs Crossplane."
      data:
        size: "small"
  providerConfigRef:
    name: akuity
