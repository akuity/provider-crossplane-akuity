---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Instance
metadata:
  name: my-cluster-instance
spec:
  forProvider:
    name: my-cluster-instance
    argocd:
      spec:
        version: "v3.3.8-ak.87"
  providerConfigRef:
    name: akuity
---
apiVersion: core.akuity.crossplane.io/v1alpha1
kind: Cluster
metadata:
  name: my-cluster
spec:
  forProvider:
    # The instance ID can be hardcoded or determined from an Instance resource
    # on the same cluster.
    # instanceId: "my-instance-id"
    instanceRef:
      name: "my-cluster-instance"
    name: "my-cluster"
    # Installs the agent into the cluster that the kubeconfig in this Secret
    # (key "kubeconfig") points at. make e2e creates it for a second Kind cluster.
    kubeconfigSecretRef:
      name: workload-kubeconfig
      namespace: crossplane-system
    removeAgentResourcesOnDestroy: true
  providerConfigRef:
    name: akuity
