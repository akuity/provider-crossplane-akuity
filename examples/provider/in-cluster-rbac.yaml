---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-crossplane-akuity-in-cluster
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-crossplane-akuity-in-cluster
rules:
  # Only what installing and removing the agent manifests needs. Crossplane's
  # RBAC manager binds the provider system ClusterRole (its own CRDs, Secrets,
  # ConfigMaps, events and Leases) to whatever ServiceAccount the provider
  # Deployment runs as, this one included, so those rules are not repeated here.
  # Agent manifest apply/teardown uses server-side apply and foreground delete.
  - apiGroups:
      - ""
    resources:
      - namespaces
      - serviceaccounts
      - services
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  # Kubernetes RBAC escalation prevention rejects creating/updating Roles
  # and ClusterRoles unless the caller already holds the granted permissions
  # or has escalate. It also rejects RoleBindings/ClusterRoleBindings unless
  # the caller has bind on the referenced Role/ClusterRole.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - clusterroles
    verbs:
      - bind
      - escalate
  # PodDisruptionBudget + NetworkPolicy: agent manifest set includes
  # akuity-agent PDB + akuity-agent-network-policy. Provider SSAs both
  # directly through this ServiceAccount during install and removes them
  # during teardown when removeAgentResourcesOnDestroy=true.
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - create
      - update
      - patch
      - delete
  # MutatingWebhookConfiguration: self-hosted KargoAgent (akuityManaged: false)
  # ships kargo-webhook MutatingWebhookConfiguration. Provider SSAs it through
  # this ServiceAccount on install and removes it on teardown.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - get
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-crossplane-akuity-in-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-crossplane-akuity-in-cluster
subjects:
  - kind: ServiceAccount
    name: provider-crossplane-akuity-in-cluster
    namespace: crossplane-system
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: akuity-in-cluster
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: provider-crossplane-akuity-in-cluster
          containers:
            - name: package-runtime
